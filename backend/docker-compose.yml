services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: feature_flags
      POSTGRES_USER: feature_user
      POSTGRES_PASSWORD: feature_pass

    ports:
      - "5432:5432"

    volumes:
      - feature_flag_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U feature_user -d feature_flags"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: feature_user
      QUARKUS_DATASOURCE_PASSWORD: feature_pass
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/feature_flags
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: update
      QUARKUS_HTTP_HOST: 0.0.0.0

    ports:
      - "8080:8080"


  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080

    depends_on:
      - backend

    ports:
      - "5173:80"


volumes:
  feature_flag_postgres_data: